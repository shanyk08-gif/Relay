services:
  - type: web
    name: relay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python hosted.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: RELAY_HOSTED
        value: "1"
      - key: RELAY_PROVIDER
        value: gemini
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
